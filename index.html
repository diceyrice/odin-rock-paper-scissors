<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button>Rock</button>
    <button>Paper</button>
    <button>Scissors</button>

    <div>Choose rock, paper, or scissors!</div>

    <script>
        console.log("Hello World");

        let humanSelection = "";
        const score = document.querySelector("div");
        
        let humanScore = 0;
        let computerScore = 0;

        function getComputerChoice() {
            choice = Math.random()*3;
            if(choice < 1) {
                return "Rock";
            }
            else if(choice < 2) {
                return "Paper";
            }
            else {
                return "Scissors";
            }
        }

        console.log(getComputerChoice());

        const buttons = document.querySelectorAll("button");

        function playGame() {
            function playRound(humanChoice, computerChoice) {
                if(humanChoice=="Rock") {
                    if(computerChoice=="Paper") {
                        computerScore++
                        score.textContent = `You lose! Paper beats Rock. You: ${humanScore}. Computer: ${computerScore}.`;
                    }
                    else if(computerChoice=="Scissors") {
                        humanScore++
                        score.textContent = `You win! Rock beats Scissors. You: ${humanScore}. Computer: ${computerScore}.`;
                    }
                    else {
                        score.textContent = `It's a tie! You: ${humanScore}. Computer: ${computerScore}.`;
                    }
                }

                if(humanChoice=="Paper") {
                    if(computerChoice=="Scissors") {
                        computerScore++
                        score.textContent = `You lose! Scossors beats Paper. You: ${humanScore}. Computer: ${computerScore}.`;
                    }
                    else if(computerChoice=="Rock") {
                        humanScore++
                        score.textContent = `You win! Paper beats Rock. You: ${humanScore}. Computer: ${computerScore}.`;
                    }
                    else {
                        score.textContent = `It's a tie! You: ${humanScore}. Computer: ${computerScore}.`;
                    }
                }

                if(humanChoice=="Scissors") {
                    if(computerChoice=="Rock") {
                        computerScore++
                        score.textContent = `You lose! Rock beats Scissors. You: ${humanScore}. Computer: ${computerScore}.`;
                    }
                    else if(computerChoice=="Paper") {
                        humanScore++
                        score.textContent = `You win! Scissors beats Paper. You: ${humanScore}. Computer: ${computerScore}.`;
                    }
                    else {
                        score.textContent = `It's a tie! You: ${humanScore}. Computer: ${computerScore}.`;
                    }
                }
            }

            let computerSelection = getComputerChoice()

            playRound(humanSelection, computerSelection)

            if(humanScore>=5||computerScore>=5) {score.textContent = `Final score: You: ${humanScore}. Computer: ${computerScore}.`;
                if(humanScore > computerScore) {
                    score.append(" You win!")
                }
                else {
                    score.append(" Computer wins!")
                }
                
                for(let i = 0;i < buttons.length; i++) {
                    buttons[i].remove();
                }

                const body = document.querySelector("body");
                const resetBtn = document.createElement("button");
                resetBtn.textContent = "Reset";
                body.appendChild(resetBtn);
                resetBtn.addEventListener('click', () => window.location.reload());
            }
        }

        for(let i = 0;i < buttons.length; i++) {
            buttons[i].addEventListener('click', (event) => {
                humanSelection = event.target.textContent
                playGame();
            });
        }
    </script>
</body>
</html>
